    <circle cx="81" cy="96" r="9"/>
    <circle cx="-11" cy="198" r="9"/>
  </g>
  <text x="760" y="180" fill="#173D36" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="IBM Plex Sans Arabic, SF Arabic, Geeza Pro, Tahoma, Arial, sans-serif" font-size="134" font-weight="800">وشائج</text>
  <text x="760" y="238" fill="#526960" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="IBM Plex Sans Arabic, SF Arabic, Geeza Pro, Tahoma, Arial, sans-serif" font-size="32" font-weight="400">لكل مكان قصة، ولكل قصة مصدر</text>
</svg>
