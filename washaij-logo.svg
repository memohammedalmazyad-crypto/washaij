<svg xmlns="http://www.w3.org/2000/svg" width="870" height="320" viewBox="250 0 870 320" role="img" aria-labelledby="title description">
  <title id="title">شعار وشائج</title>
  <desc id="description">اسم وشائج مع رمز يجمع شكل الواو بخطّ يربط نقاطًا؛ إشارة إلى الأماكن والقصص ومصادرها.</desc>
