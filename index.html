<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d36">
  <meta name="description" content="وشائج: خريطة حيّة للذاكرة الثقافية السعودية — أماكن وشخصيات وأحداث، لكل معلومة مصدر ظاهر.">
  <title>وشائج | لكل مكان قصة، ولكل قصة مصدر</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23173d36'/%3E%3Cpath d='M47 14C35 5 18 12 16 27c-2 14 12 25 24 17 8-6 6-17-2-18' fill='none' stroke='%23f3ece1' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='47' cy='14' r='4' fill='%23b7834d'/%3E%3Ccircle cx='38' cy='26' r='4' fill='%23b7834d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="./style.css?v=36">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="./app.js?v=36"></script>
</head>
<body>
<div id="intro" class="intro" aria-hidden="true">
  <img class="intro-logo" src="./washaij-logo.svg" alt="">
  <span class="intro-tag">لكل مكان قصة، ولكل قصة مصدر</span>
</div>

<header class="topbar">
  <a class="brand" href="./index.html">
    <img src="./washaij-logo.svg" alt="وشائج">
  </a>
  <p class="tagline">لكل مكان قصة، ولكل قصة مصدر</p>
  <a class="rights-link" href="./سجل-الحقوق.html">المصادر والحقوق ↗</a>
</header>

<nav class="regions" id="regions" aria-label="المناطق"></nav>

<section class="era" aria-label="تصفية بالفترة الزمنية">
  <div class="periods" id="periods" role="group" aria-label="الفترات"></div>
  <div class="era-head">
    <span class="era-title">الفترة</span>
    <output id="eraOut" class="era-out"></output>
    <button id="eraReset" class="era-reset" type="button">كل الفترات</button>
  </div>
  <div class="era-track">
    <div class="era-fill" id="eraFill"></div>
    <input type="range" id="eraFrom" aria-label="من سنة">
    <input type="range" id="eraTo" aria-label="إلى سنة">
  </div>
  <p class="era-note" id="eraNote"></p>
</section>

<main class="layout">
  <section class="stage" aria-label="العرض">
    <div class="stage-head">
      <div class="views" role="tablist" aria-label="طريقة العرض">
        <button role="tab" data-view="map" class="on" aria-selected="true">الخريطة</button>
        <button role="tab" data-view="time" aria-selected="false">الزمن</button>
        <button role="tab" data-view="web" aria-selected="false">الشبكة</button>
      </div>
      <p class="stage-hint" id="stageHint"></p>
    </div>

    <div class="stage-body">
      <div id="mapView" class="view">
        <div id="map"></div>
        <div class="map-grain" aria-hidden="true"></div>
        <div class="map-vignette" aria-hidden="true"></div>
        <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="34" fill="none" stroke="#8a7350" stroke-width="1.4"/>
          <circle cx="50" cy="50" r="27" fill="none" stroke="#8a7350" stroke-width=".7" stroke-dasharray="2 4"/>
          <path d="M50 10 57 50 50 44 43 50Z" fill="#8a7350"/>
          <path d="M50 90 43 50 50 56 57 50Z" fill="#8a7350" opacity=".45"/>
          <path d="M10 50 50 43 44 50 50 57Z" fill="#8a7350" opacity=".45"/>
          <path d="M90 50 50 57 56 50 50 43Z" fill="#8a7350" opacity=".45"/>
          <text x="50" y="8" text-anchor="middle" font-size="11" font-weight="700" fill="#7c6742">ش</text>
        </svg>
      </div>
      <div id="timeView" class="view hide"><div class="timeline" id="timeline"></div></div>
      <div id="webView" class="view hide">
        <svg id="web" viewBox="0 0 760 520" role="img" aria-label="شبكة تربط المناطق والأماكن والشخصيات والأحداث"></svg>
        <div class="web-legend">
          <span><i class="k-region"></i>منطقة</span>
          <span><i class="k-place"></i>مكان</span>
          <span><i class="k-person"></i>شخصية</span>
          <span><i class="k-event"></i>حدث</span>
          <span><i class="k-material"></i>مادة</span>
        </div>
      </div>
    </div>

    <div class="coverage" id="coverage"></div>
      <div class="region-note" id="regionNote"></div>
  </section>

  <section class="browser" aria-label="الفهرس">
    <div class="search">
      <input id="q" type="search" placeholder="ابحث في كل المناطق…" aria-label="بحث" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
    <div class="tabs" role="tablist" aria-label="نوع المحتوى">
      <button role="tab" data-kind="place" class="on" aria-selected="true">أماكن</button>
      <button role="tab" data-kind="person" aria-selected="false">شخصيات</button>
      <button role="tab" data-kind="event" aria-selected="false">أحداث</button>
      <button role="tab" data-kind="material" aria-selected="false">مواد</button>
      <button role="tab" data-kind="site" aria-selected="false">السجل الوطني</button>
    </div>
    <div class="list" id="list"></div>
  </section>

  <aside class="detail" id="detail" aria-live="polite" aria-label="التفاصيل"></aside>
</main>

<footer class="foot">
  <span>وشائج — نموذج أولي. كل بطاقة تحمل رابط مصدرها.</span>
  <span>الروابط بين العناصر مدخلة تحريريًا من أوصاف المصادر، ولم تُستخرج آليًا.</span>
</footer>
</body>
</html>
