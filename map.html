<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d36">
  <meta name="description" content="وشائج: بنية ثقافية ذكية تحوّل المصادر السعودية الموثّقة إلى معرفة مترابطة وتجارب تفاعلية قابلة للتشغيل في المتاحف والفعاليات والمنصات الرقمية.">
  <title>وشائج | الخريطة التفاعلية</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2715%27%20fill%3D%27%23173d36%27%2F%3E%3Cg%20transform%3D%27translate%2814.7%2010.5%29%20scale%28.21%29%20rotate%28180%2082.5%20103%29%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23f3ece1%27%20stroke-width%3D%2722%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M176%2032C145%207%20101%208%2068%2029C34%2051%2022%2091%2033%20124C45%20159%2083%20177%20114%20165C143%20154%20154%20121%20137%2098C123%2079%2096%2077%2081%2096%27%2F%3E%3Cpath%20d%3D%27M43%20145C34%20179%2016%20195-11%20198%27%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%27%23b7834d%27%3E%3Ccircle%20cx%3D%27176%27%20cy%3D%2732%27%20r%3D%2715%27%2F%3E%3Ccircle%20cx%3D%2781%27%20cy%3D%2796%27%20r%3D%2715%27%2F%3E%3Ccircle%20cx%3D%27-11%27%20cy%3D%27198%27%20r%3D%2715%27%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./leaflet.css?v=1">
  <link rel="preload" as="image" href="./intro-map.svg?v=65">
  <link rel="preload" as="image" href="./washaij-logo-white.svg?v=62">
  <link rel="stylesheet" href="./style.css?v=69">
  <script defer src="./leaflet.js?v=1"></script>
  <script defer src="./inline-data.js?v=59"></script>
  <script defer src="./chat-config.js?v=59"></script>
  <script defer src="./app.js?v=68"></script>
</head>
<body>
<div class="intro" id="intro" aria-hidden="true">
  <img class="intro-map" src="./intro-map.svg?v=65" alt="">
  <span class="intro-focus" aria-hidden="true"></span>
  <img class="intro-logo" src="./washaij-logo-white.svg?v=62" alt="">
</div>
<header class="topbar">
  <a class="brand" href="./index.html" aria-label="العودة إلى صفحة التعريف">
    <img src="./washaij-logo.svg?v=59" alt="وشائج — شخصيات تحكي، وأماكن تشهد">
  </a>
  <p class="tagline"><span aria-hidden="true"></span>الخريطة التفاعلية</p>
  <a class="docs-link" href="./index.html">الصفحة الرئيسية</a>
</header>

<nav class="regions" id="regions" aria-label="المناطق"></nav>

<section class="era" aria-label="تصفية بالفترة الزمنية">
  <div class="periods" id="periods" role="group" aria-label="الفترات"></div>
  <div class="era-head">
    <span class="era-title">النطاق الزمني</span>
    <output id="eraOut" class="era-out"></output>
    <button id="eraReset" class="era-reset" type="button">كل الفترات</button>
  </div>
  <div class="era-track">
    <div class="era-fill" id="eraFill"></div>
    <input type="range" id="eraFrom" aria-label="من سنة">
    <input type="range" id="eraTo" aria-label="إلى سنة">
  </div>
  <p class="era-note" id="eraNote"></p>
</section>

<main class="layout">
  <section class="stage" aria-label="العرض">
    <div class="stage-head">
      <div class="views" role="tablist" aria-label="طريقة العرض">
        <button role="tab" data-view="map" class="on" aria-selected="true">على الخريطة</button>
        <button role="tab" data-view="time" aria-selected="false">عبر الزمن</button>
        <button role="tab" data-view="web" aria-selected="false">بين الوشائج</button>
      </div>
      <p class="stage-hint" id="stageHint"></p>
    </div>

    <div class="stage-body">
      <div id="mapView" class="view">
        <div id="map"></div>
        <div class="map-grain" aria-hidden="true"></div>
        <div class="map-vignette" aria-hidden="true"></div>
        <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="34" fill="none" stroke="#8a7350" stroke-width="1.4"/>
          <circle cx="50" cy="50" r="27" fill="none" stroke="#8a7350" stroke-width=".7" stroke-dasharray="2 4"/>
          <path d="M50 10 57 50 50 44 43 50Z" fill="#8a7350"/>
          <path d="M50 90 43 50 50 56 57 50Z" fill="#8a7350" opacity=".45"/>
          <path d="M10 50 50 43 44 50 50 57Z" fill="#8a7350" opacity=".45"/>
          <path d="M90 50 50 57 56 50 50 43Z" fill="#8a7350" opacity=".45"/>
          <text x="50" y="8" text-anchor="middle" font-size="11" font-weight="700" fill="#7c6742">ش</text>
        </svg>
      </div>
      <div id="timeView" class="view hide"><div class="timeline" id="timeline"></div></div>
      <div id="webView" class="view hide">
        <svg id="web" viewBox="0 0 760 520" role="img" aria-label="شبكة تربط المناطق والأماكن والشخصيات والأحداث"></svg>
        <div class="web-legend">
          <span><i class="k-region"></i>منطقة</span>
          <span><i class="k-place"></i>مكان</span>
          <span><i class="k-person"></i>شخصية</span>
          <span><i class="k-event"></i>حدث</span>
          <span><i class="k-material"></i>مادة</span>
        </div>
      </div>
    </div>
      <div class="region-note" id="regionNote"></div>
  </section>

  <section class="browser" aria-label="الفهرس">
    <div class="search">
      <input id="q" type="search" placeholder="ابحث عن شخص أو مكان أو حدث…" aria-label="بحث" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
    <div class="tabs" role="tablist" aria-label="نوع المحتوى">
      <button role="tab" data-kind="place" class="on" aria-selected="true"><span>أماكن</span></button>
      <button role="tab" data-kind="person" aria-selected="false"><span>شخصيات</span></button>
      <button role="tab" data-kind="event" aria-selected="false"><span>أحداث</span></button>
    </div>
    <div class="list" id="list"></div>
  </section>

  <aside class="detail" id="detail" aria-live="polite" aria-label="التفاصيل"></aside>
</main>

<footer class="foot">
  <span>وشائج — نموذج عامل لبنية ثقافية ذكية.</span>
</footer>
</body>
</html>
